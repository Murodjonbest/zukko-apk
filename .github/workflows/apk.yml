name: Zukko APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: APK yig'ish
        run: gradle assembleRelease bundleRelease
      - name: Nomlash
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk out/Zukko.apk
          cp app/build/outputs/bundle/release/app-release.aab out/Zukko.aab
      - uses: actions/upload-artifact@v4
        with:
          name: zukko
          path: out/*
      - name: Tayyor fayllarni «apk» bo'limiga joylash
        run: |
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -qm "Zukko ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
