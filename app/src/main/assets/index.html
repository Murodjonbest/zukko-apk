<style>
/* VOICE: friendly, focused study tool — a coach, not a toy
   IDEA: a pocket flashcard deck on a cobalt desk
   PICTURE: the live card itself, large, at the top of the work area
   COLOUR and TYPE: cobalt desk, white paper cards, sunflower accent; Sora titles, Manrope body, system CJK/Arabic
   LAYOUT: cobalt band with language chips and level; tabs; one calm column up to 760px */
:root{color-scheme:light dark;--bg:light-dark(#f4f6fb,#0d1220);--paper:light-dark(#fff,#161d31);--ink:light-dark(#121826,#eef1f7);--mute:light-dark(#5b6478,#9aa3b8);--line:light-dark(#dfe4ee,#26304a);--cob:light-dark(#2346d8,#2a45b8);--cobd:light-dark(#1a36ad,#1d3290);--sun:#ffc83d;--ok:light-dark(#0f8a5f,#3fcf95);--bad:light-dark(#c8333a,#ff7a7f);--mid:light-dark(#b36b00,#ffb547)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,"Noto Sans JP","Noto Sans SC","Noto Sans KR","Noto Sans Arabic",sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Sora,Manrope,sans-serif;margin:0;line-height:1.1;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;min-height:44px;padding:0 16px;background:var(--paper);border:1px solid var(--line);font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input{font-size:16px;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);width:100%}
.top{background:var(--cob);color:#fff;padding:18px max(4vw,14px) 0}
.wrap{max-width:760px;margin:0 auto}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand h1{font-size:22px}.streak{font-weight:700;background:rgba(255,255,255,.14);border-radius:99px;padding:6px 12px;white-space:nowrap;font-size:14px}
.streak b{color:var(--sun)}
.langs{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.langs button{flex:none;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff;display:flex;gap:8px;align-items:center}
.langs button i{font-style:normal;font-family:Sora;font-size:12px;background:rgba(255,255,255,.2);border-radius:6px;padding:2px 6px}
.langs button[aria-pressed=true]{background:#fff;color:var(--cobd)}.langs button[aria-pressed=true] i{background:var(--sun);color:#121826}
.lv{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;background:rgba(0,0,0,.18);border-radius:14px;padding:5px;margin:10px 0 14px}
.lv button{background:none;border:0;color:#fff;min-height:40px;font-size:14px}.lv button[aria-pressed=true]{background:var(--sun);color:#121826}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;background:none;border:0;border-radius:12px 12px 0 0;color:rgba(255,255,255,.85);font-size:14px;padding:0 14px}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink)}
main{padding:20px max(4vw,14px) 60px}
.muted{color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 18px 40px -24px rgba(20,40,120,.45);position:relative}
.deck{position:relative;margin-top:14px}
.deck::before,.deck::after{content:"";position:absolute;inset:10px 14px -8px;background:var(--paper);border:1px solid var(--line);border-radius:22px;z-index:-1;opacity:.7}
.deck::after{inset:20px 28px -16px;opacity:.4}
.word{font-size:clamp(36px,9vw,56px);font-weight:700;line-height:1.15;text-align:center;margin:22px 0 6px;overflow-wrap:anywhere}
.rom{text-align:center;color:var(--mute);font-size:18px}
.ans{text-align:center;font-size:24px;font-weight:700;margin-top:18px;padding-top:18px;border-top:2px dashed var(--line)}
.spk{width:48px;height:48px;padding:0;border-radius:50%;display:inline-grid;place-items:center;background:var(--cob);border:0;color:#fff;flex:none}
.spk.slow{background:var(--paper);color:var(--cob);border:2px solid var(--cob)}
.spk svg{width:22px;height:22px}
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.grades button{min-height:56px;display:grid;line-height:1.2;align-content:center}.grades small{font-weight:600;color:var(--mute);font-size:12px}
.g0{border-color:var(--bad)!important;color:var(--bad)}.g1{border-color:var(--mid)!important;color:var(--mid)}.g2{border-color:var(--ok)!important;color:var(--ok)}
.pri{background:var(--cob);color:#fff;border:0}.big{width:100%;min-height:56px;font-size:17px;margin-top:18px}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 6px}
.stat div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:Sora;font-size:24px}.stat span{font-size:12px;color:var(--mute)}
.list{display:grid;gap:10px;margin-top:14px}
.ph{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.ph .t{font-size:20px;font-weight:700}.ph .r{color:var(--mute);font-size:14px}.ph .u{font-size:14px}
.ph .btns{grid-row:1/4;grid-column:2;display:flex;flex-direction:column;gap:6px}
.hide .u,.hide .t,.hide .r{filter:blur(6px)}.hide .ph:hover .t{filter:none}
.opts{display:grid;gap:8px;margin-top:16px}
.opts button{text-align:start;min-height:54px;font-size:18px;font-weight:600}
.opts .right{background:color-mix(in srgb,var(--ok) 16%,var(--paper));border-color:var(--ok)}.opts .wrong{background:color-mix(in srgb,var(--bad) 16%,var(--paper));border-color:var(--bad)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--cob);border-radius:99px}
.lrow{display:grid;grid-template-columns:5.5em minmax(0,1fr) 4.5em;gap:10px;align-items:center;padding:8px 0}
.lrow span:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.days{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;margin-top:10px}.days i{aspect-ratio:1;border-radius:5px;background:var(--line)}.days i.on{background:var(--ok)}
.step{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.step .tm{font-family:Sora;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chk{width:44px;height:44px;padding:0;border-radius:12px;font-size:20px}.chk[aria-pressed=true]{background:var(--ok);color:#fff;border-color:var(--ok)}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:700}.fb.y{background:color-mix(in srgb,var(--ok) 15%,var(--paper));color:var(--ok)}.fb.n{background:color-mix(in srgb,var(--bad) 13%,var(--paper));color:var(--bad)}
.mic[data-on="1"]{background:var(--bad);color:#fff;border-color:var(--bad)}
.tip{border-left:4px solid var(--sun);padding:8px 14px;background:var(--paper);border-radius:0 12px 12px 0;margin-top:16px;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;margin-top:10px}
.tiles button{min-height:72px;padding:6px 4px;display:grid;align-content:center;justify-items:center;gap:2px;position:relative}
.tiles b{font-size:26px;line-height:1.1;font-weight:700}.tiles small{font-size:12px;color:var(--mute);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tiles button[aria-pressed=true]{border:2px solid var(--cob);background:color-mix(in srgb,var(--cob) 8%,var(--paper))}
.tiles button.ok::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.glyph{font-size:clamp(64px,18vw,104px);font-weight:700;line-height:1;text-align:center}
.abhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
@media(max-width:600px){.abhead{grid-template-columns:minmax(0,1fr);text-align:center}.abhead .row{justify-content:center}}
.mn{margin-top:16px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--sun) 16%,var(--paper));border:1px solid color-mix(in srgb,var(--sun) 55%,var(--line));text-align:start}
.mn p{margin:6px 0}.mn .row button{min-height:40px;font-size:14px;padding:0 12px}.mn .own{font-weight:600}
textarea{font:inherit;font-size:16px;width:100%;border-radius:12px;border:1px solid var(--line);background:var(--paper);padding:10px 12px;margin:8px 0}
.tech{display:grid;gap:10px;margin-top:14px}.tech details{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.tech summary{font-weight:700;cursor:pointer;min-height:28px}.tech p{margin:8px 0 0}
#chf button{padding:0 12px;flex:none}
.xpb{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;margin-top:10px}.xpb .bar{flex:1;height:8px}
.subs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-4px 0 16px}.subs button{flex:none;min-height:38px;font-size:14px;border-radius:99px}.subs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button[aria-pressed=true]:not(.chk):not(.tiles button){border-color:var(--cob)}
.road .lrow{grid-template-columns:6.5em minmax(0,1fr) 3em}.road{display:grid;gap:12px;margin-top:12px;position:relative}
.lvc.cur{border:2px solid var(--cob)}
.lvb{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--line);font-family:Sora;font-weight:700;font-size:18px;flex:none}
.lvb.ok{background:var(--ok);color:#fff}.lvc.cur .lvb:not(.ok){background:var(--cob);color:#fff}
.lv button{padding:0 2px;font-size:13px;line-height:1.1;display:grid;place-content:center}.lv button small{font-size:10px;opacity:.7;font-weight:600}.lv button{white-space:nowrap;letter-spacing:-.2px}
.lvb{min-width:52px;width:auto!important;padding:0 6px;font-size:15px!important}
.lsn{display:flex;gap:12px;align-items:center;text-align:start;min-height:64px;padding:10px 14px;width:100%}.lsn:disabled{opacity:.55}
.lsno{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--cob);color:#fff;font-family:Sora;flex:none}.lsn.done .lsno{background:var(--ok)}.lsn:disabled .lsno{background:var(--line);color:var(--mute)}
.vlink{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);text-decoration:none;min-height:56px}
.vplay{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#e62117;color:#fff;flex:none;font-size:15px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pcell{display:grid;gap:4px;justify-items:center;text-align:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--paper);min-height:120px;align-content:center}
.pcell.pright{border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--paper))}.pcell.pwrong{border:2px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--paper))}
body.full .top{display:none}body.full main{padding-top:10px}
.onb{min-height:calc(100dvh - 40px);display:flex;flex-direction:column;gap:16px}
.obtop{display:flex;align-items:center;gap:12px}.obx{width:44px;padding:0;border:0;background:none;font-size:24px;color:var(--mute)}
.say{display:flex;gap:12px;align-items:center;margin:6px 0}.say>div:first-child{flex:none}.bub{position:relative;border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-size:17px;background:var(--paper)}
.bub::before{content:"";position:absolute;left:-9px;top:50%;width:14px;height:14px;background:var(--paper);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.obo{display:flex;gap:14px;align-items:center;min-height:64px;font-size:17px;border-width:2px;border-bottom-width:4px;border-radius:16px;text-align:start}
.obo[aria-pressed=true]{border-color:#1cb0f6;background:color-mix(in srgb,#1cb0f6 12%,var(--paper));color:#1899d6}
.oe{font-size:30px}.obc{width:30px;height:30px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;color:#fff}.obo[aria-pressed=true] .obc{background:#1cb0f6;border-color:#1cb0f6}
.flag{display:inline-grid;place-items:center;min-width:40px;height:30px;border-radius:7px;background:var(--cob);color:#fff;font-family:Sora;font-size:13px;padding:0 6px}
.ring{width:30px;height:30px;border-radius:50%;background:conic-gradient(#1cb0f6 var(--p),var(--line) 0);mask:radial-gradient(circle,transparent 8px,#000 9px);-webkit-mask:radial-gradient(circle,transparent 8px,#000 9px);flex:none}
.go3d{background:#58cc02;color:#fff;border:0;border-radius:16px;box-shadow:0 5px 0 #46a302;font-size:17px;letter-spacing:.02em;text-transform:uppercase;min-height:54px;margin-bottom:8px}
.go3d:active{transform:translateY(3px);box-shadow:0 2px 0 #46a302}.go3d:disabled{background:var(--line);box-shadow:0 5px 0 color-mix(in srgb,var(--line) 70%,#000);color:var(--mute)}
.streakbig{display:inline-flex;align-items:center;gap:6px;font-family:Sora;font-size:34px;color:#ff9f1c;margin-top:10px}.streakbig svg{width:40px;height:40px}
.pathhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;margin-bottom:12px}.ph1{display:inline-flex;align-items:center;gap:4px;color:#ff9f1c;font-family:Sora}
.unit{display:flex;align-items:stretch;background:#58cc02;color:#fff;border-radius:18px;box-shadow:0 5px 0 #46a302;overflow:hidden;margin-bottom:14px}.unit>div{flex:1;padding:14px 18px;display:grid}.unit small{opacity:.85;font-weight:700;letter-spacing:.04em}.unit b{font-size:20px;font-family:Sora}
.unitb{border:0;border-left:2px solid rgba(0,0,0,.12);border-radius:0;background:none;color:#fff;font-size:26px;width:64px}
.path{display:grid;justify-items:center;gap:18px;padding:44px 0 24px}.pn{position:relative}
.node{width:72px;height:66px;border-radius:50%;border:0;font-size:26px;color:#fff;background:#58cc02;box-shadow:0 7px 0 #46a302;padding:0}
.node.done{background:#ffc800;box-shadow:0 7px 0 #e5a000}.node.pr{background:#ce82ff;box-shadow:0 7px 0 #a568cc}.node.tr{background:#ff9600;box-shadow:0 7px 0 #cc7800}
.node.lock{background:var(--line);box-shadow:0 7px 0 color-mix(in srgb,var(--line) 70%,#000);color:var(--mute)}
.node.cur{outline:6px solid color-mix(in srgb,#58cc02 30%,transparent);outline-offset:5px}
.tip2{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-10px);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:800;color:#58cc02;white-space:nowrap;font-size:14px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mgrid>div{display:grid;gap:12px}
.mt{min-height:64px;font-size:18px;border-width:2px;border-bottom-width:4px;border-radius:16px;transition:opacity .3s,transform .15s}
.mt.ms{border-color:#1cb0f6;background:color-mix(in srgb,#1cb0f6 12%,var(--paper));color:#1899d6}.mt.mb{border-color:var(--bad);color:var(--bad);animation:shk .3s}.mt.md{opacity:.35}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:no-preference){.anor.happy{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}}
body:not(.full) main{padding-bottom:96px}
.bnav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--paper);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:8}
.bnav button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11px;min-height:54px;padding:0;color:var(--mute)}.bnav button span{font-size:22px;filter:grayscale(1);opacity:.7}
.bnav button[aria-current=true]{color:var(--ink)}.bnav button[aria-current=true] span{filter:none;opacity:1}
.hero{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:22px;padding:14px 18px;background:linear-gradient(120deg,#2346d8,#4f7bff 60%,#6ee7d0);color:#fff;margin-top:14px;min-height:110px}.hero .arrow{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:22px}
.tchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}.tchips button{flex:none;border-radius:99px;min-height:40px;border:0;background:var(--line)}.tchips button[aria-pressed=true]{background:var(--cob);color:#fff}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tcard{display:grid;padding:0;border:0;border-radius:22px;overflow:hidden;background:var(--g);min-height:220px;align-content:end;text-align:center;position:relative}
.temo{position:absolute;top:14px;left:0;right:0;font-size:64px}.tbox{background:var(--paper);margin:10px;border-radius:14px;padding:10px;display:grid;gap:2px}.tbox b{font-size:15px;line-height:1.2}.tbox small{font-size:12px;color:var(--mute);line-height:1.3}
.tlv{justify-self:center;background:#fcd34d;color:#78350f;font-weight:800;font-size:11px;border-radius:6px;padding:1px 6px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}.wk small{display:block;font-weight:700;color:var(--mute);margin-bottom:6px}.wk small.td{color:var(--ink)}
.wk span{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;background:var(--line);color:#fff;font-weight:800;max-width:44px;margin:0 auto}.wk span.on{background:#f5793b}
.strk{background:linear-gradient(#fde68a,#fffbeb);border-radius:24px;padding:12px;margin-top:12px}.strk1{display:flex;gap:16px;align-items:center;background:#fff;color:#111;border-radius:18px;padding:14px;margin-bottom:12px}
.fl{position:relative;display:grid;place-items:center}.fl svg{width:64px;height:64px}.fl b{position:absolute;bottom:6px;color:#fff;font-family:Sora;font-size:18px}

{t:"Listening: strategiyalar",sub:"Listening",body:`### Tuzilma
Audio **faqat bir marta** eshittiriladi. 4 qism qiyinlashib boradi:
- 1-qism — kundalik suhbat (koʻpincha forma toʻldirish)
- 2-qism — kundalik monolog (eʼlon, ekskursiya)
- 3-qism — oʻqishga oid suhbat (2–4 kishi)
- 4-qism — akademik maʼruza
### Asosiy strategiyalar
- Har qismdan oldin berilgan vaqtda savollarni oʻqing, **kalit soʻzlarni** belgilang va javob turini taxmin qiling: raqam, ism, sana yoki ot.
- **Soʻz cheklovi**: «NO MORE THAN TWO WORDS AND/OR A NUMBER» boʻlsa, 3 soʻz yozilgan javob notoʻgʻri hisoblanadi.
- **Imlo** muhim: notoʻgʻri yozilgan javob hisoblanmaydi. Ismlar odatda harflab aytiladi.
- **Chalgʻitish (distractor)**: soʻzlovchi fikrini oʻzgartiradi — «Actually…», «Sorry, I mean…». Oxirgi aytilgan variant toʻgʻri.
- **Parafraza**: savoldagi soʻz audioda boshqacha aytiladi (cheap → doesn't cost much).
- Bitta javobni oʻtkazib yuborsangiz, toʻxtab qolmang — keyingisiga oʻting.
### Taxminiy ball
30/40 ≈ 7.0 · 23/40 ≈ 6.0 · 35/40 ≈ 8.0`,

60 daqiqa, 3 matn, 40 savol. Har matnga taxminan **20 daqiqa**. Qogʻoz imtihonida javoblarni varaqaga oʻtkazish uchun **qoʻshimcha vaqt berilmaydi**.

- **TRUE** — gap matndagi maʼlumotga mos.
- **FALSE** — gap matndagi maʼlumotga zid.
- **NOT GIVEN** — matnda bu haqida maʼlumot yoʻq.
Oʻz bilimingizdan foydalanmang — faqat matnga tayaning. **YES / NO / NOT GIVEN** esa muallifning fikri haqida.

- Savoldagi soʻzlar matnda sinonim bilan berilishi mumkin.

read:`Green roofs — roofs partly or completely covered with plants — have become increasingly common in European cities over the past two decades. Supporters argue that they bring several benefits. First, vegetation absorbs rainwater, which reduces the pressure on city drainage systems during heavy storms. Second, plants and soil act as insulation, so buildings with green roofs often need less energy for heating in winter and cooling in summer. Some studies have also suggested that green roofs can lower the temperature of the surrounding air, although the size of this effect depends on the climate and the type of plants used.

{t:"Writing Task 1: grafik tavsifi",sub:"Writing",body:`### Vazifa

{t:"Writing Task 2: esse",sub:"Writing",body:`### Vazifa
Kamida **250 soʻz**, taxminan **40 daqiqa**. Ballga Task 1 dan ikki barobar koʻproq taʼsir qiladi.
### Esse turlari
- **Opinion** — To what extent do you agree or disagree?
- **Discussion** — Discuss both views and give your own opinion.
- **Advantages / Disadvantages** — afzallik va kamchiliklar.
- **Problem / Solution** — sabablar va yechimlar.
- **Two-part question** — ikki alohida savol.
### Tuzilma (4–5 paragraf)
1. **Kirish** — mavzuni parafraza qiling va pozitsiyangizni aniq ayting (thesis).
2. **Asosiy paragraflar** (2–3 ta) — har birida bitta gʻoya: topic sentence → izoh → misol.
3. **Xulosa** — pozitsiyani qisqa takrorlang. Yangi dalil kiritilmaydi.
Savolning **barcha qismlariga** javob bering — aks holda Task Response pasayadi.
### 4 ta mezon (har biri 25%)

{t:"Writing: Band 7+ til va grammatika",sub:"Writing",body:`### Lexical Resource
- Aniq soʻzlar va **kollokatsiyalar**: make a decision, heavy traffic, pose a threat, address an issue.
- Kam uchraydigan soʻzlar faqat toʻgʻri ishlatilganda ball beradi.
- Takrorlamaslik uchun sinonimlar; yodlangan shablonlardan qoching.
### Grammatical Range and Accuracy
- Oddiy va murakkab gaplar aralash: shart gaplar, majhul nisbat, nisbiy gaplar.
- Band 7 uchun gaplarning koʻpchiligi **xatosiz** boʻlishi kerak.
### Rasmiy uslub
- Qisqartmalar yoʻq: don't → **do not**.
- «a lot of» oʻrniga **a large number of / a great deal of**.
- «you» bilan murojaatdan qoching: *people / individuals*.
### Odat
Har kuni bitta paragraf yoki esse yozing va xatolaringizni daftarga yozib boring.`,

{t:"Speaking Part 1",sub:"Speaking",body:`### Format
4–5 daqiqa. Oʻzingiz, ish yoki oʻqish, uy, qiziqishlar haqida tanish savollar.
### Javob formulasi
**Javob + sabab + misol yoki tafsilot** — 2–3 gap. «Yes.» bilan toʻxtamang, lekin juda uzun nutq ham kerak emas.
*Do you like reading? — Yes, I do. I usually read before bed because it helps me relax. Lately I've been reading detective novels.*
### Maslahatlar
- Tabiiy gapiring: yodlangan javob sezilib qoladi va ball tushishi mumkin.
- Savolni tushunmasangiz: **Could you repeat the question, please?**
- Zamonlarni toʻgʻri ishlating: I used to…, I've been…
### 4 ta mezon

q:[["Part 1 davomiyligi:",["1–2 daqiqa","4–5 daqiqa","10 daqiqa","15 daqiqa"],1,"4–5 daqiqa."],["«Do you like reading?» uchun eng yaxshi javob:",["Yes.","Yes, I do. I usually read before bed because it helps me relax.","3 daqiqalik nutq","No comment."],1,"Javob + sabab + tafsilot."],["Savolni tushunmasangiz:",["Jim turish","«Could you repeat the question, please?»","Boshqa mavzuda gapirish","Oʻzbekcha soʻrash"],1,"Qayta soʻrash mumkin."],["Yodlangan javoblar:",["Yuqori ball beradi","Imtihonchi sezadi, ball tushishi mumkin","Majburiy","Farqi yoʻq"],1,"Tabiiy nutq baholanadi."],["Speaking’da nechta mezon bor?",["2","3","4","5"],2,"Fluency, Lexis, Grammar, Pronunciation."]]},
{t:"Speaking Part 2: kartochka",sub:"Speaking",body:`### Format
Mavzu va 3–4 bandli kartochka beriladi. **1 daqiqa** tayyorgarlik (qalam va qogʻoz beriladi), keyin **1–2 daqiqa** gapirasiz, soʻng 1–2 qisqa savol.
### Strategiya
- Eslatmaga har band uchun 2–3 **kalit soʻz** yozing — toʻliq gap emas.
- Barcha bandlarni yoriting. Oxirgi «**explain why…**» bandi odatda eng muhimi.
- 2 daqiqani toʻldirish uchun hikoya qiling: qachon, qayerda, kim bilan, nima his qildingiz.
- Oʻtgan voqea boʻlsa — **oʻtgan zamon**.
### Namuna kartochka
*Describe a building you like. You should say: where it is, what it looks like, when you first saw it, and explain why you like it.*`,
w:[["cue card","savol kartochkasi"],["impressive","taʼsirli"],["I'll never forget…","…ni hech qachon unutmayman"],["what struck me was…","meni hayratga solgani…"],["all in all","umuman olganda"]],
q:[["Tayyorgarlik vaqti:",["30 soniya","1 daqiqa","2 daqiqa","5 daqiqa"],1,"1 daqiqa."],["Gapirish vaqti:",["30 soniya","1–2 daqiqa","5 daqiqa","10 daqiqa"],1,"1–2 daqiqa."],["Eslatmaga nima yoziladi?",["Toʻliq matn","Kalit soʻzlar","Hech narsa","Faqat raqamlar"],1,"Qisqa kalit soʻzlar."],["Koʻpincha eng muhim band:",["where it is","when","explain why","who"],2,"Sabab va fikringiz — chuqurlik koʻrsatadi."],["Oʻtgan voqeani tasvirlashda:",["Kelasi zamon","Oʻtgan zamon","Faqat hozirgi zamon","Buyruq mayli"],1,"Oʻtgan zamon."]]},
{t:"Speaking Part 3: munozara",sub:"Speaking",body:`### Format
4–5 daqiqa. Part 2 mavzusiga oid **mavhum, umumiy** savollar: jamiyat, kelajak, solishtirish.
### Javob tuzilmasi
**Fikr → sabab → misol → (qarama-qarshi tomon) → qisqa xulosa**
### Foydali iboralar
- It depends on… · From my point of view… · One reason is that…
- On the other hand… · In the long run… · It's likely that…
- Bilmasangiz ham: *I've never really thought about it, but I suppose…*
### Maslahat
Javobni kengaytiring, lekin savoldan chetga chiqmang. Imtihonchi bilan munozara — bu yaxshi belgi.`,
w:[["from my point of view","mening nuqtai nazarimdan"],["in the long run","uzoq muddatda"],["on the other hand","boshqa tomondan"],["it's likely that","ehtimol"],["to some extent","maʼlum darajada"]],
q:[["Part 3 savollari qanday?",["Shaxsiy va oddiy","Mavhum va umumiy","Faqat ha/yoʻq","Faqat raqamlar"],1,"Mavhum, jamiyat va kelajak haqida."],["Yaxshi javob tuzilmasi:",["Faqat fikr","Fikr + sabab + misol","Faqat misol","Savolni takrorlash"],1,"Fikrni asoslang va misol keltiring."],["Mavzuni bilmasangiz:",["«I don't know.» deb toʻxtash","«I've never really thought about it, but I suppose…»","Jim turish","Mavzuni oʻzgartirish"],1,"Baribir fikr bildiring."],["Qarama-qarshi fikrni kiritish iborasi:",["On the other hand","Firstly","For example","In my house"],0,"On the other hand."],["Part 3 davomiyligi:",["1–2 daqiqa","4–5 daqiqa","10–12 daqiqa","15 daqiqa"],1,"4–5 daqiqa."]]},
{t:"Ballni oshirish rejasi",sub:"Reja",body:`### 5 → 6
Grammatik asoslar, ~3000 soʻz, Task Response’ni toʻliq bajarish, Listening’da imlo va soʻz cheklovi.
### 6 → 7
Murakkab tuzilmalar xatosiz, akademik lugʻat va kollokatsiyalar, T/F/NG’da aniqlik, Speaking’da **ravonlik** (uzun pauzalarsiz).
### 7 → 8
Nozik lugʻat, deyarli xatosiz yozuv, kuchli dalillash, tabiiy talaffuz va intonatsiya.
### Kunlik reja (90 daqiqa)
- 20 daq — Listening
- 30 daq — Reading
- 25 daq — Writing (Task 1 yoki 2 dan bir qism)
- 15 daq — Speaking: oʻzingizni yozib oling va eshiting
### Haftalik
Haftada **1 ta toʻliq mock test** (rasmiy Cambridge IELTS kitoblari), xatolar daftari va har bir esseni tahlil qilish.`,
w:[["mock test","sinov imtihoni"],["fluency","ravonlik"],["accuracy","aniqlik"],["error log","xatolar daftari"],["target band","maqsadli ball"]],
q:[["Haftada nechta toʻliq mock test tavsiya etildi?",["0","1","7","14"],1,"Haftada bitta."],["6 → 7 uchun Speaking’da asosiy talab:",["Koʻp pauza","Ravonlik","Faqat oddiy soʻzlar","Juda sekin gapirish"],1,"Fluency — uzun pauzalarsiz nutq."],["Xatolar daftarining foydasi:",["Vaqt oʻtkazish","Takroriy xatolarni koʻrish va tuzatish","Ball beradi","Majburiy"],1,"Bir xil xatoni qaytarmaslik."],["Speaking mashqida foydali usul:",["Faqat oʻqish","Oʻzingizni yozib olib eshitish","Faqat yozish","Hech narsa"],1,"Oʻz nutqingizni eshitib tuzatasiz."],["Listening’da 5 → 6 uchun eʼtibor:",["Imlo va soʻz cheklovi","Faqat tez oʻqish","Uzun javoblar","Savollarni oʻqimaslik"],0,"Imlo va soʻz cheklovi koʻp ball yoʻqotadi."]]}];

const LV=[[1,"A1"],[2,"A2"],[3,"B1"],[4,"B2"],[5,"C1"],[6,"C2"]];

const NEW=10, DAY=864e5;
const SPK='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
const SLOW='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7z"/></svg>';
const parse=s=>s.trim().split("\n").map(x=>{const[a,b]=x.split("|");return{w:a.trim(),r:(b||"").trim()}});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toLocaleDateString("sv");
const $=id=>document.getElementById(id);
let S={lang:"en",lv:1,dir:"f",tab:"card",P:{},D:{},ts:0};
try{const j=JSON.parse(localStorage.getItem("tilU")||"null");if(j)S=Object.assign(S,j)}catch(e){}
const P=()=>S.P[S.lang]??={c:{},my:[]};
const Dy=()=>S.D[today()]??={rev:0,nw:0,bonus:0,plan:[0,0,0,0,0],sh:0,test:0,sp:0,xp:0};
let db=null,dbDoc=null,saveT=0;
function save(){S.ts=Date.now();try{localStorage.setItem("tilU",JSON.stringify(S))}catch(e){}
 if(dbDoc){clearTimeout(saveT);saveT=setTimeout(()=>{dbDoc.set({json:JSON.stringify(S),ts:S.ts}).catch(()=>{})},1200)}}
const R=()=>RAW[S.lang];
const attr=()=>R().rtl?' dir="rtl" lang="ar"':` lang="${R().l}"`;
function deck(lv=S.lv){const ws=parse(R()["w"+lv]).map((x,i)=>({id:lv+":"+i,w:x.w,r:x.r,u:UZ["w"+lv][i]})).concat(((P().gen||{})[lv]||[]).map((x,i)=>({id:"g"+lv+":"+i,w:x.w,r:x.r,u:x.u,e:x.e})));return ws.concat(P().my.map(m=>({id:m.id,w:m.w,r:m.r,u:m.u,mine:1})))}
function phrases(){return parse(R()["p"+S.lv]).map((x,i)=>({w:x.w,r:x.r,u:UZ["p"+S.lv][i]}))}
/* ---- audio ---- */
let tts=null;
async function say(t,slow){
 if(tts){try{await tts.speak(t,{language:R().l,rate:slow?.7:1});return}catch(e){if(e&&e.code==="not_granted")tts=null}}
 try{const s=window.speechSynthesis;if(!s)throw 0;s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=R().t;u.rate=slow?.6:.95;
  const v=s.getVoices().find(v=>v.lang&&v.lang.replace("_","-").startsWith(R().l));if(v)u.voice=v;s.speak(u)}catch(e){toast("Bu qurilmada ovoz chiqarish ishlamadi")}}
function sayAll(lines){if(tts){tts.speak(lines.map((t,i)=>({text:t,language:R().l,voice:i%2?"airy":"buttery"}))).catch(()=>{});return}try{const s=window.speechSynthesis;s.cancel();lines.forEach(t=>{const u=new SpeechSynthesisUtterance(t);u.lang=R().t;u.rate=.95;s.speak(u)})}catch(e){toast("Bu qurilmada ovoz chiqarish ishlamadi")}}
function toast(m){const f=document.createElement("div");f.className="fb n";f.textContent=m;$("view").prepend(f);setTimeout(()=>f.remove(),3000)}
/* ---- streak ---- */
function active(d){const x=S.D[d];return x&&(x.xp||x.rev||x.sh||x.test||x.sp||x.plan.some(Boolean))}
function streak(){let n=0,t=new Date();if(!active(t.toLocaleDateString("sv")))t=new Date(t-DAY);while(active(t.toLocaleDateString("sv"))){n++;t=new Date(t-DAY)}return n}
/* ---- header ---- */
function head(){
 $("langs").innerHTML=Object.entries(RAW).map(([k,v])=>`<button data-l="${k}" aria-pressed="${k===S.lang}"><i>${v.c}</i>${v.n}</button>`).join("");
 if(S.lv>lvN())S.lv=lvN();$("lv").style.gridTemplateColumns=`repeat(${lvN()},minmax(0,1fr))`;$("lv").innerHTML=LV.slice(0,lvN()).map(([k])=>{const sh=lvC(k-1),c=CEFR[k-1].c,sb=lvSub(k-1);return`<button data-v="${k}" aria-pressed="${k===S.lv}" title="${esc(lvF(k-1))} · CEFR ${c}">${sh}${sb?`<small>${sb}</small>`:""}</button>`}).join("");
 const g=grpOf(S.tab);$("tabs").innerHTML=GROUPS.map(gr=>`<button role="tab" data-t="${gr[1][0][0]}" aria-selected="${gr===g&&g[1].some(x=>x[0]===S.tab)}">${gr[0]}</button>`).join("");
 const dx=Dy().xp||0,goal=S.goal||50;$("streak").innerHTML=`${FLAME}<b>${streak()}</b> kun · ${lvlOf(S.xpTot)}-daraja`;
 $("xpb").innerHTML=`<div class="bar" style="background:rgba(255,255,255,.2)"><i style="width:${Math.min(100,dx/goal*100)}%;background:var(--sun)"></i></div><span>Bugun ${dx}/${goal} XP${dx>=goal?" ✓":""}</span>`;
}
/* ---- flashcards ---- */
let cur=null,shown=false,lastFl="",tyRes=null;
function queue(){if(hardMode){const h=hardList().filter(x=>!hardDone.has(x.id));if(h.length)return{due:h,fresh:[]};hardMode=false;hardDone=new Set()}const now=Date.now(),c=P().c,d=deck();
 const due=d.filter(x=>c[x.id]&&c[x.id].due<=now).sort((a,b)=>c[a.id].due-c[b.id].due);
 const room=Math.max(0,NEW+Dy().bonus-Dy().nw);
 return{due,fresh:d.filter(x=>!c[x.id]).slice(0,room)}}
function vCard(){
 const q=queue(),all=q.due.concat(q.fresh);const d=deck(),c=P().c;
 const learned=d.filter(x=>c[x.id]&&c[x.id].iv>=7).length;
 if(!cur||!all.find(x=>x.id===cur.id)){cur=all[0]||null;shown=false}
 let h=`<div class="stat"><div><b>${q.due.length}</b><span>takrorlash</span></div><div><b>${q.fresh.length}</b><span>yangi soʻz</span></div><div><b>${learned}/${d.length}</b><span>oʻzlashtirildi</span></div></div>`;
 if(!cur){return h+`<div class="card" style="text-align:center"><h2 style="font-size:26px;margin-top:10px">Bugungi kartochkalar tugadi</h2><p class="muted">Ertaga takrorlash uchun soʻzlar oʻz vaqtida qaytib keladi. Hozir yana davom etmoqchi boʻlsangiz, yangi soʻz qoʻshing yoki tinglash mashqiga oʻting.</p>
  <button class="pri big" data-a="more">Yana 10 ta yangi soʻz</button><button class="big" data-a="go" data-to="listen">Tinglashga oʻtish</button></div>`}
 const isNew=!c[cur.id],front=S.dir==="f";const fk=cur.id+shown+S.dir,fl=fk!==lastFl;lastFl=fk;
 const tgt=`<div class="word"${attr()}>${esc(cur.w)}</div>${cur.r?`<div class="rom">${esc(cur.r)}</div>`:""}`;
 const uz=`${picH(cur,72)}<div class="word" style="font-size:clamp(30px,7vw,44px);margin-top:${pic(cur)?8:22}px">${esc(cur.u)}</div>`;
 h+=`<div class="deck"><div class="card ${fl?"flip":""}" id="fc"><div class="row sp"><span class="muted">${isNew?"Yangi soʻz":"Takrorlash"}${cur.mine?" · mening soʻzim":""}</span>
  <div class="row"><button class="spk" data-a="say" aria-label="Eshitish">${SPK}</button><button class="spk slow" data-a="sayslow" aria-label="Sekin eshitish">${SLOW}</button></div></div>
  ${front?tgt:uz}
  ${shown&&tyRes?`<div class="fb ${tyRes.ok?"y":"n"}">${tyRes.ok?"Toʻgʻri! ":"Siz yozdingiz: "}${tyRes.ok?"":esc(tyRes.v)}</div>`:""}${shown?`<div class="ans">${front?picH(cur,64)+esc(cur.u):`<span${attr()}>${esc(cur.w)}</span>${cur.r?`<div class="rom" style="font-size:16px;font-weight:600">${esc(cur.r)}</div>`:""}`}</div>
   <div style="text-align:center;margin-top:10px"><button data-a="picadd" style="min-height:36px;font-size:13px">${IMG[imKey(cur)]?"Rasmni almashtirish":"Oʻz rasmingizni biriktiring"}</button></div>${mnBox(cur.id,{kind:"w",w:cur.w,r:cur.r,u:cur.u})}<div class="grades"><button class="g0" data-g="0">Bilmadim<small>1 daqiqadan keyin</small></button><button class="g1" data-g="1">Qiyin<small>${fmt(next(1))}</small></button><button class="g2" data-g="2">Bildim<small>${fmt(next(2))}</small></button></div>`
   :S.ans==="type"?`<form id="tyf" style="margin-top:18px"><input id="tyi" autocomplete="off" placeholder="${front?"Oʻzbekcha maʼnosini yozing…":R().n+" tilida yozing…"}"${front?"":attr()}><div class="row" style="margin-top:10px"><button class="pri" style="flex:1">Tekshirish</button><button type="button" data-a="show">Bilmayman</button></div></form>`
   :`<button class="pri big" data-a="show">Javobni koʻrsatish</button>`}
 </div></div>
 ${hardMode?`<div class="fb n" style="margin-top:18px">Qiyin soʻzlar rejimi · <a href="#" data-a="hardoff">chiqish</a></div>`:""}
 <div class="row sp" style="margin-top:26px"><span class="muted">Javob usuli</span><div class="row"><button data-a="ansm" data-m="flip" aria-pressed="${S.ans!=="type"}">Ochib koʻrish</button><button data-a="ansm" data-m="type" aria-pressed="${S.ans==="type"}">Yozib javob berish</button></div></div>
 <div class="row sp" style="margin-top:10px"><span class="muted">Yoʻnalish</span><div class="row"><button data-a="dir" aria-pressed="${front}">${R().n} → Oʻzbek</button><button data-a="dir" aria-pressed="${!front}">Oʻzbek → ${R().n}</button></div></div>
 <div class="tip">Avval oʻzingiz baland ovozda ayting, keyin javobni oching. Halol baholang: «Bildim» faqat oʻylanmasdan esga tushgan boʻlsa.</div>`;
 return h}
function next(g){const s=P().c[cur.id]||{iv:0,e:2.5,n:0};if(g===1)return Math.max(1,Math.round(s.iv*1.2));return s.n===0?1:s.n===1?3:Math.round(s.iv*s.e)}
const fmt=d=>d<30?d+" kundan keyin":Math.round(d/30)+" oydan keyin";
function grade(g){const c=P().c,id=cur.id,s=c[id]||{iv:0,e:2.5,n:0},d=Dy();if(!c[id])d.nw++;d.rev++;(d.seen??=[]).includes(id)||d.seen.push(id);if(hardMode)hardDone.add(id);if(g===0)s.lap=(s.lap||0)+1;xp(g);tyRes=null;
 if(g===0){s.iv=0;s.n=0;s.e=Math.max(1.3,s.e-.2);s.due=Date.now()+6e4}
 else{s.iv=next(g);if(g===1)s.e=Math.max(1.3,s.e-.15);else s.n++;s.due=Date.now()+s.iv*DAY-36e5}
 c[id]=s;cur=null;shown=false;save();render()}
/* ---- listen ---- */
let hideTxt=false;
function vListen(){const ps=phrases();
 return `<h2 style="font-size:24px">Tinglash va shadowing</h2><p class="muted">Iborani eshiting, 1–2 soniya orqasidan baland ovozda takrorlang. Har bir iborani 3–5 marta qiling. Bugun: <b>${Dy().sh}</b> ta takrorlash.</p>
 <div class="row"><button data-a="hide" aria-pressed="${hideTxt}">${hideTxt?"Matnni koʻrsatish":"Matnni yashirish (faqat quloq bilan)"}</button><button data-a="all">Hammasini ketma-ket eshitish</button></div>
 <div class="list ${hideTxt?"hide":""}">${ps.map((p,i)=>`<div class="ph"><div class="t"${attr()}>${esc(p.w)}</div>${p.r?`<div class="r">${esc(p.r)}</div>`:""}<div class="u">${esc(p.u)}</div>
  <div class="btns"><button class="spk" data-p="${i}" aria-label="Eshitish">${SPK}</button><button class="spk slow" data-ps="${i}" aria-label="Sekin">${SLOW}</button><button data-a="shd" style="min-height:36px;padding:0 10px;font-size:13px">+1</button></div></div>`).join("")}</div>`}
/* ---- speak ---- */
let sp=null,spFb="",dict=null,listening=false;
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[\s.,!?;:'"’ʼʻ`\-、。，？！؟،]/g,"");
function vSpeak(){const d=deck();if(!sp)sp=d[Math.floor(Math.random()*d.length)];
 return `<h2 style="font-size:24px">Gapirish mashqi</h2><p class="muted">Oʻzbekcha soʻzni koʻring va uni ${R().n.toLowerCase()} tilida ayting${dict?" (mikrofon tugmasi)":""} yoki yozing.</p>
 <div class="card" style="margin-top:12px"><div class="muted">Oʻzbekcha</div><div class="word" style="font-size:clamp(30px,8vw,46px)">${esc(sp.u)}</div>
 <form id="spf" class="row" style="margin-top:14px;flex-wrap:nowrap"><input id="spi" autocomplete="off" placeholder="Javobingiz…"${attr()}>${dict?`<button type="button" class="mic" data-a="mic" data-on="${listening?1:0}" aria-label="Mikrofon">${listening?"Toʻxtatish":"Mikrofon"}</button>`:""}<button class="pri">Tekshirish</button></form>
 ${spFb}<div class="row" style="margin-top:14px"><button data-a="hint">Yordam (ilk harf)</button><button data-a="spnext">Keyingi soʻz</button></div></div>
 <p class="muted" style="margin-top:12px">Bugun gapirilgan soʻzlar: <b>${Dy().sp}</b></p>`}
function check(){const v=$("spi").value;if(!v.trim())return;const ok=[sp.w,...sp.r.split("·")].some(x=>x&&norm(x)===norm(v));
 if(ok){Dy().sp++;xp(2);save()}
 spFb=`<div class="fb ${ok?"y":"n"}">${ok?"Toʻgʻri!":"Toʻgʻri javob:"} <span${attr()}>${esc(sp.w)}</span>${sp.r?" — "+esc(sp.r):""}</div>`;render();say(sp.w)}
/* ---- test ---- */
let T=null;
function mkTest(items,n=10){const d=items||deck();if(d.length<4)return null;const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
 return{i:0,ok:0,qs:sh(d).slice(0,n).map(x=>{const k=["m","t","e"][Math.floor(Math.random()*3)];const opts=sh([x,...sh(d.filter(y=>y.id!==x.id&&y.u!==x.u)).slice(0,3)]);return{x,k,opts,pick:null}})}}

const POSR="(n|v|y|adj|adv|prep|conj|pron|interj|phr)";
const isDefLine=l=>/^[A-Z][a-z']*\b.*\b(is|are|means|was|has|have|use|when|if|to)\b/i.test(l)&&/[a-z]{3}/.test(l)&&!/[ʻʼ'’`]/.test(l.slice(0,12).replace(/^[A-Za-z]+'s/,""));
function cleanWord(w){w=w.trim();if(/^([A-Za-z] )+[A-Za-z]$/.test(w))w=w.replace(/ /g,"");return w.replace(/^[^A-Za-z]+/,"").replace(/[^A-Za-z]+$/,"").toLowerCase()}
function parseEssential(txt){const L=txt.split(/\r?\n/).map(s=>s.replace(/\s+/g," ").trim());const out=[];
 const WD="((?:[A-Za-z] ){1,12}[A-Za-z]|[A-Za-z][A-Za-z'\\-]{1,24}(?: [A-Za-z][A-Za-z'\\-]{1,14})?)";
 const re1=new RegExp("^[^A-Za-z\\[]{0,4}(?:[rcCfl] (?=[a-z]{2}))?"+WD+"\\s*\\[([^\\]]{0,28}?)\\]?\\s*"+POSR+"\\.\\s*(.*)$");
 const re3=new RegExp("^[^A-Za-z\\[]{0,4}(?:[A-Za-z]-? (?=[A-Za-z]{2}))?"+WD+"\\s*\\[([^\\]]{0,28}?)(?:\\]|\\s|$)\\s*(?:[A-Za-z/*]{1,3}\\.?\\s+|\\*\\s*|[A-Z/]\\.)?(.*)$");
 const re2=new RegExp("^[^A-Za-z\\[]{0,4}(?:[rcCfl] (?=[a-z]{2}))?"+WD+"\\s+(?:\\S{1,8}\\s+)?"+POSR+"\\.\\s+(.*)$");
 for(let i=0;i<L.length;i++){const l=L[i];if(!l||l.length>120)continue;
  let m=l.match(re1)||l.match(re2);if(!m){const k=l.match(re3);if(k)m=[k[0],k[1],k[2],"",k[3]];else continue}
  const w=cleanWord(m[1]);if(!w||w.length<2||/\.{3}/.test(l)||/^(the|a|an|and|it|he|she|they|this|you)$/.test(w))continue;
  if(!/\[/.test(l)&&!/^[^A-Za-z]{0,4}[a-z]/.test(l))continue;if(/[,;]/.test(m[1]))continue;
  let u=(m[4]||"").trim();let j=i+1;
  const nxt=()=>{while(j<L.length&&(!L[j]||L[j].length<4&&!/[a-z]{3}/i.test(L[j])||/^[^A-Za-z]{1,8}$/.test(L[j])))j++;return L[j]||""};
  if(!u||u.length<2){const n=nxt();if(n&&!isDefLine(n)&&n.length<60){u=n;j++}}
  let d=nxt();if(!isDefLine(d)){d=""}else j++;
  let e=nxt();if(/^[-—–*■►»>•~\s]{1,4}[A-Z“"]/.test(e)||(/^[A-Z]/.test(e)&&e!==d&&/\.\s*["”]?$/.test(e))){e=e.replace(/^[-—–*■►»>•~\s]+/,"");j++}else e="";
  if(!u&&!d)continue;if(/[A-Z]{2}/.test(u)&&!/[a-z]/.test(u))u="";
  out.push({w,r:(m[2]||"").trim(),p:m[3]==="y"?"v":(m[3]||""),u:u.replace(/\s*[;,]\s*$/,""),d,e});i=j-1}
 const seen=new Set();return out.filter(x=>{if(seen.has(x.w))return false;seen.add(x.w);return true})}
function parseMnemo(txt){const t=txt.replace(/\s+/g," ");const parts=t.split(/\s(?=[0-9IlOSEWf]{1,4}\s?[.,)]\s*[A-Z][a-zA-Z])/);const out=[];
 const re=/^([0-9IlOSEWf]{1,4})\s?[.,)]\s*([A-Za-z][A-Za-z \-'.]{0,30}?)\s*\(([^)]{1,40})\)\s*[-–—~]+\s*([^:()]{2,90}?)\s*(?::|;|!|(?=\())\s*(?:\(([^)]{1,60})\))?\s*(.*)$/;
 for(const p of parts){const m=p.trim().match(re);if(!m)continue;const w=cleanWord(m[2]);if(!w||w.length<2)continue;
  let s=(m[6]||"").trim();const cut=s.search(/\s\d{1,4}\s?[.,)]\s*[A-Z]/);if(cut>0)s=s.slice(0,cut);s=s.replace(/\s*;\s*$/,"").slice(0,300);
  if(m[4].trim().length<2)continue;out.push({w,r:m[3].trim(),u:m[4].trim().replace(/[;,]$/,""),k:(m[5]||"").trim(),s})}
 const seen=new Set();return out.filter(x=>{if(seen.has(x.w))return false;seen.add(x.w);return true})}
function parseSimple(txt){const out=[];for(const l of txt.split(/\r?\n/)){if(l.length>90||/[.!?]\s+[A-Z]/.test(l))continue;const m=l.match(/^\s*\d*[.)]?\s*([^\t\-–—=|:]{1,40}?)\s*(?:\[([^\]]*)\]|\(([^)]*)\))?\s*[\t\-–—=|:]\s*(.{1,80})$/);if(m&&/\p{L}/u.test(m[1]))out.push({w:m[1].trim(),r:(m[2]||m[3]||"").trim(),u:m[4].trim()})}return out}
function parseBook(txt){const a=parseEssential(txt),b=parseMnemo(txt),c=parseSimple(txt);
 const best=b.length>=200&&b.length>a.length*0.6?["mnemo",b]:a.length>=40?["essential",a]:[["essential",a],["mnemo",b],["simple",c]].sort((x,y)=>y[1].length-x[1].length)[0];return{kind:best[0],items:best[1]}}
/* rebuild text lines from pdf.js text items */
function itemsToLines(items){const rows=[];for(const it of items){if(!it.str||!it.str.trim())continue;const y=Math.round(it.transform[5]),x=it.transform[4];let r=rows.find(r=>Math.abs(r.y-y)<=3);if(!r)rows.push(r={y,its:[]});r.its.push({x,s:it.str})}
 rows.sort((a,b)=>b.y-a.y);return rows.map(r=>r.its.sort((a,b)=>a.x-b.x).map(i=>i.s).join(" ").replace(/\s+/g," ").trim())}

function parseVerbs(txt){const out=[];for(const l of txt.split(/\r?\n/)){const m=l.replace(/\s+/g," ").match(/^\s*\d{1,3}[.)]\s*([a-z]{2,15})\s+([a-z]{2,15}(?:\/[a-z]{2,15})?(?:, ?[a-z]{2,15})?)\s+([a-z]{2,15}(?:\/[a-z]{2,15})?(?:, ?[a-z]{2,15})?)\s+(.{2,})$/i);if(m)out.push({w:m[1].toLowerCase(),f:[m[2],m[3]],u:m[4].trim(),d:m[2]+" · "+m[3]})}
 const seen=new Set();return out.filter(x=>!seen.has(x.w)&&seen.add(x.w))}
function parseSpeaking(txt){const topics=[];let cur=null;const L=txt.split(/\r?\n/).map(s=>s.replace(/\s+/g," ").trim());
 for(const l of L){const h=l.match(/^(?:\d{1,3}[.)]\s*)?([A-Z][A-Z0-9 &',/\-]{3,48})$/);if(h&&!/^(PART|VOCABULARY|IELTS|PREFACE|CONTENTS|EG)\b/.test(h[1])){cur={t:h[1].trim(),q:[],part:/PART 2|CUE/i.test(l)?2:0};topics.push(cur);continue}
  const pm=l.match(/^PART\s*([123])/i);if(pm&&cur){cur.part=+pm[1];continue}
  const q=l.replace(/^[●•\-*\d.)\s]+/,"");if(cur&&/\?$/.test(q)&&q.length>8&&q.length<200&&!cur.q.includes(q))cur.q.push(q)}
 return topics.filter(t=>t.q.length>=2)}

const GRX={
en:`"to be" — "boʻlmoq": I bilan am, he/she/it bilan is, you/we/they bilan are. Inkor: am not, isn't, aren't. Savolda oldinga chiqadi: Are you…? ¦ Men oʻqituvchiman. U uyda.
Doimiy, odatiy ishlar uchun. He/she/it bilan feʼlga -s qoʻshiladi (works). Inkor: don't / doesn't + feʼl. Savol: Do / Does …? ¦ Men har kuni ishlayman. U Toshkentda ishlaydi.
a / an — bitta, nomaʼlum narsa (an — unli tovush oldidan). the — maʼlum, ilgari aytilgan yoki yagona narsa. ¦ bir kitob, bir olma, quyosh
Koʻplik uchun -s qoʻshiladi; s, x, sh, ch, o bilan tugasa -es. Notoʻgʻri shakllar ham bor: man → men, child → children. ¦ kitob → kitoblar, quti → qutilar
can + feʼl (toʻgʻri shaklda) — "qila olaman". Hamma shaxsda bir xil. Inkor: can't. Savol: Can you…? ¦ Men suza olaman. Menga yordam bera olasizmi?
Oʻtgan ish uchun. Toʻgʻri feʼllarga -ed (worked), notoʻgʻrilari yodlanadi (go → went). Inkor: didn't + feʼl. Savol: Did you…? ¦ Men ishladim. Kecha bozorga bordim.
Hozir, shu daqiqada boʻlayotgan ish: am/is/are + feʼl-ing. ¦ Men hozir oʻqiyapman.
will + feʼl — oʻsha zahoti qaror yoki taxmin; be going to + feʼl — oldindan rejalashtirilgan ish. ¦ Sizga qoʻngʻiroq qilaman. Men mashina sotib olmoqchiman.
Qisqa sifatlarga -er (qiyosiy) va the -est (orttirma). Uzun sifatlarda more / the most. Notoʻgʻrilari: good – better – the best. ¦ katta – kattaroq – eng katta
some — darak gapda, any — inkor va savolda. much — sanalmaydigan (water, money), many — sanaladigan (books) otlar bilan. ¦ Menda biroz pul bor. Suv bormi?
have/has + 3-shakl (been, done). Natijasi hozir muhim boʻlgan yoki hayotiy tajriba. Aniq vaqt (yesterday) bilan ishlatilmaydi. ¦ Men Turkiyada boʻlganman. U tugatdi.
1-tur: If + hozirgi zamon, will + feʼl — real ehtimol. 2-tur: If + oʻtgan zamon, would + feʼl — xayoliy holat (I/he bilan ham were). ¦ Yomgʻir yogʻsa, qolaman. Boy boʻlganimda sayohat qilardim.
must — majburiyat, should — maslahat, may/might — ehtimol, have to — tashqi majburiyat. Keyin feʼl toʻgʻri shaklda keladi. ¦ Siz dubulgʻa kiyishingiz shart. Dam olishingiz kerak.
be + 3-shakl. Ishni kim qilgani muhim boʻlmaganda yoki nomaʼlum boʻlganda. Bajaruvchi by bilan aytiladi. ¦ Uy 2020-yilda qurilgan.
who — odam, which — narsa, that — ikkalasi uchun; where — joy, whose — egalik. Otni aniqlashtiradi. ¦ Qoʻngʻiroq qilgan odam — mening boshligʻim.
had + 3-shakl — oʻtmishdagi boshqa ishdan ham oldin boʻlgan ish. ¦ Men kelganimda poyezd ketib boʻlgan edi.
If + had + 3-shakl, would have + 3-shakl — oʻtmishda boʻlmagan, xayoliy holat va uning natijasi (afsus). ¦ Oʻqiganimda, imtihondan oʻtgan boʻlardim.
Birovning gapini aytganda zamon bir qadam orqaga suriladi: am → was, will → would; men → he va hokazo. ¦ U charchaganini aytdi.
Baʼzi feʼllardan keyin -ing (enjoy, finish, avoid), baʼzilaridan to + feʼl (decide, want, hope) keladi. Yodlash kerak. ¦ Men oʻqishni yaxshi koʻraman. Ketishga qaror qildim.
Har bir zamonda be + 3-shakl: is done, is being done, was done, has been done, will be done. ¦ Hisobot tayyorlanmoqda.
Never, rarely, not only kabi soʻzlar gap boshiga chiqsa, savoldagidek tartib boʻladi (have I seen). Taʼkid uchun. ¦ Bunday tartibsizlikni hech koʻrmaganman.
Shart oʻtmishda, natija hozirda (yoki aksincha): If + had + 3-shakl, would + feʼl (now). ¦ Oʻsha ishga kirganimda, hozir boy boʻlardim.
It is/was … that/who … — gapning bir qismini ajratib taʼkidlash. What I need is… ham shunday. ¦ Meni aynan narx hayron qoldirdi.
must have + 3-shakl — oʻtmish haqida ishonchli taxmin; should have + 3-shakl — qilinmagan ishga afsus/tanbeh. ¦ U unutgan boʻlsa kerak. Menga aytishingiz kerak edi.
nevertheless — shunga qaramay, moreover — bundan tashqari, whereas — holbuki, albeit — garchi. Rasmiy yozuvda ishlatiladi. ¦ shunga qaramay, bundan tashqari, holbuki, garchi
Feʼl + koʻmakchi yangi maʼno beradi (put up with — chidamoq). Idiomalarni soʻzma-soʻz tarjima qilib boʻlmaydi, butunligicha yodlanadi. ¦ chidamoq, tasodifan uchratmoq, yashirin baraka
Feʼlni otga aylantirish (decide → decision) — akademik va rasmiy uslubni ixchamlashtiradi. ¦ Ular kengaytirishga qaror qildi → Kengaytirish qarori
Takrorlamaslik uchun soʻzlarni tushirib qoldirish yoki so, one, do bilan almashtirish. ¦ Shunday deb umid qilaman. Istardim, lekin qila olmayman.
Fikrni yumshatish: it seems, arguably, may, tend to. Akademik yozuvda qatʼiy daʼvodan saqlanadi. ¦ Koʻrinishidan… Aytish mumkinki…
Vaziyatga qarab rasmiy (We regret to inform you) yoki samimiy (Sorry, but) uslubni tanlash. ¦ Sizga afsus bilan maʼlum qilamiz… / Kechirasiz, lekin…`,
tr:`Qoʻshimcha soʻzning oxirgi unlisiga moslashadi: ingichka (e, i, ö, ü) → -ler, -de; yoʻgʻon (a, ı, o, u) → -lar, -da. ¦ uylar, kitoblar; uyda, maktabda
Feʼl + -(i)yor + shaxs qoʻshimchasi: -um, -sun, -, -uz, -sunuz, -lar. Hozir boʻlayotgan ish. ¦ Kelyapman. Ishlayapti.
Egalik: -(ı)m — mening, -(ı)n — sening, -(s)ı — uning, -(ı)mız, -(ı)nız, -ları. Unli uygʻunligiga boʻysunadi. ¦ kitobim, kitobing, kitobi
-de/-da — qayerda, -den/-dan — qayerdan, -e/-a — qayerga. Jarangsiz undoshdan keyin -te/-ten. ¦ uyda, uydan, uyga
var — bor, yok — yoʻq. Egalik bilan "menda bor" maʼnosi: Param var — Pulim bor. ¦ Pulim bor. Vaqtim yoʻq.
Feʼl + -di/-dı/-du/-dü + shaxs: -m, -n, -, -k, -nız, -ler. Koʻrgan, aniq oʻtgan ish. ¦ Kecha keldim. Maktabga ketdi.
Feʼl + -ecek/-acak + shaxs. Undoshdan oldin k → ğ boʻladi: arayacağım. ¦ Ertaga qoʻngʻiroq qilaman.
-ir/-er/-r — odat, umumiy haqiqat, vaʼda. Inkori -mez/-maz. ¦ Har kuni choy ichaman.
Sen uchun feʼl oʻzagi (Gel!), siz uchun -in/-ın (Oturun). Muloyim: lütfen qoʻshiladi. ¦ Kel! Oʻtiring, iltimos.
daha — -roq (daha büyük — kattaroq), en — eng (en güzel). Taqqoslanayotgan narsa -den bilan: benden uzun. ¦ kattaroq, eng chiroyli
Feʼl + -se/-sa + shaxs — "agar … sa". ¦ Vaqt boʻlsa, kelaman.
-en/-an — harakatni bajaruvchi (oʻqiyotgan), -dik/-dığ — oʻtgan yoki boʻlgan (oʻqigan) + egalik. ¦ oʻqiyotgan talaba, men oʻqigan kitob
Feʼl + -ebil/-abil — "qila olmoq". Inkori -eme/-ama: gelemem. ¦ Suza olaman. Kela olasanmi?
-il/-ın/-n — majhul nisbat: ish kim tomonidan qilingani aytilmaydi. ¦ Eshik ochildi. Uy qurildi.
-ip — ketma-ket ishlarni bogʻlaydi; -erek — qanday holatda bajarilganini bildiradi. ¦ Turib ketdi. Kulib gapirdi.
-mişti — oʻtmishdan ham oldingi ish; -ecekti — oʻtmishda rejalangan, lekin boʻlmagan ish. ¦ Kelgan edi. Ketmoqchi edi.
-diğini / -eceğini söyledi — birovning gapini bilvosita aytish. ¦ Kelishini aytdi.
-dir/-t — orttirma: ishni birovga qildirish. ¦ Yozdirdim. Kuttirdi.
-seydi … -irdi — oʻtmishdagi xayoliy shart va afsus. ¦ Bilganimda kelardim.
-e rağmen — qaramay, -diği halde — boʻlsa ham, -dikçe — sari. ¦ qaramay, … boʻlsa ham, … sari
Rasmiy matnda -mekte (hozirgi), -dığı takdirde (… boʻlgan taqdirda), -mek suretiyle (… yoʻli bilan) ishlatiladi. ¦ -moqda, … boʻlgan taqdirda, … yoʻli bilan
-casına — "xuddi … dek" (delicesine — telbalarcha); -dıkça — "… sari". ¦ telbalarcha; oʻqigan sari
Rasmiy va kitobiy turk tilida arab-fors soʻzlari koʻp; ularning koʻpi oʻzbek tilida ham bor. ¦ masʼuliyat, muassasa, ehtimol
Uzun ergash gaplar: sifatdosh va ravishdoshlar bilan bir gapda bir necha fikr bogʻlanadi. ¦ uzun ergash gapli akademik matnlar
Rasmiy xatlarda tayyor iboralar: Arz ederim (maʼlum qilaman), Bilgilerinize sunulur (eʼtiboringizga havola). ¦ Arz qilaman. Maʼlumotingiz uchun taqdim etiladi.
Maqollarni soʻzma-soʻz emas, maʼnosi bilan tushunish va oʻrnida ishlatish. ¦ Tomchi-tomchi koʻl boʻlur.
Sheʼr va romanlarda soʻz tartibi erkin, obrazli iboralar koʻp. ¦ sheʼr va roman tilining nozikliklari
-dır gapda ham taxmin (boʻlsa kerak), ham qatʼiy daʼvoni bildirishi mumkin — kontekstga qarang. ¦ -dir (taxmin) va -dir (qatʼiylik)
Soʻzlashuvda tovushlar qisqaradi: Ne haber → N'aber, Ne yapıyorsun → Napıyon. ¦ Nima gap? Nima qilyapsan?
Nutqda dalil, misol va xulosani tartib bilan bayon qilish, ritorik savollardan foydalanish. ¦ nutq va munozara uslubi`,
ru:`Otlarning 3 jinsi bor: undosh bilan tugasa — erkak (стол), -а/-я — ayol (книга), -о/-е — oʻrta (окно). Sifat jinsga moslashadi. ¦ stol, kitob, deraza
я — men, ты — sen, он/она — u, мы — biz, вы — siz, они — ular. Вы — hurmat shakli ham. ¦ men, sen, u, u (ayol), biz, siz, ular
Feʼl shaxsga qarab oʻzgaradi: я читаю, ты читаешь, он читает, мы читаем, вы читаете, они читают. ¦ men oʻqiyman, sen oʻqiysan, u oʻqiydi
Koʻplik asosan -ы yoki -и bilan (стол → столы); г, к, х, ж, ш, ч, щ dan keyin -и yoziladi. ¦ stol → stollar, kitob → kitoblar
Это — "bu". Hozirgi zamonda "boʻlmoq" feʼli tushib qoladi: Это мой дом. ¦ Bu mening uyim.
Oʻtgan zamon jinsga qarab: он читал, она читала, оно читало, они читали. ¦ men oʻqidim, biz oʻqidik
Kelasi zamon: буду + noaniq shakl (jarayon) yoki tugallangan feʼl (прочитаю — oʻqib chiqaman). ¦ men oʻqiyman / oʻqib chiqaman
Tushum kelishigi (кого? что?) — harakat obyekti: маму. Oʻrin kelishigi (где? о ком?) в/на bilan: в Ташкенте. ¦ Men onamni koʻryapman. Men Toshkentda yashayman.
идти/ехать — bir yoʻnalishda, hozir ketyapti; ходить/ездить — qatnab, odatda. Piyoda — идти, transportda — ехать. ¦ bormoq (piyoda) / bormoq (transportda)
1 bilan — bosh kelishik, 2–4 bilan — qaratqich birlik (рубля), 5 va undan koʻp bilan — qaratqich koʻplik (рублей). ¦ 1 rubl, 2 rubl, 5 rubl
6 kelishik: bosh (кто?), qaratqich (кого?), joʻnalish (кому?), tushum (кого?), vosita (кем?), predlojniy (о ком?). ¦ kim? kimning? kimga? kim bilan? kim haqida?
Nomukammal tur (делать) — jarayon, takror; mukammal tur (сделать) — natija, bir marta. ¦ qilmoq (jarayon) / qilib boʻlmoq (natija)
-ся qoʻshimchasi harakat oʻziga qaytishini yoki majhullikni bildiradi. ¦ Men oʻqiyman. Doʻkon ochiladi.
Buyruq: sen uchun -й/-и (Читай!), siz uchun -те qoʻshiladi (Читайте!). ¦ Oʻqi! Oʻqing!
который — "qaysiki"; jins va son boʻyicha otga, kelishik boʻyicha ergash gapga moslashadi. ¦ Qoʻngʻiroq qilgan odam — akam.
Sifatdosh: -ущ/-ющ (oʻqiyotgan), -нн/-т (oʻqilgan). Kitobiy uslubda koʻp ishlatiladi. ¦ oʻqiyotgan, oʻqilgan
Ravishdosh: -я (читая — oʻqib turib), -в (прочитав — oʻqib boʻlib). ¦ oʻqib turib, oʻqib boʻlib
Если бы + oʻtgan zamon, … бы + oʻtgan zamon — xayoliy shart. ¦ Bilganimda kelardim.
Prefiks yoʻnalishni bildiradi: в- (kirmoq), вы- (chiqmoq), пере- (oʻtmoq), у- (ketmoq). ¦ kirmoq, chiqmoq, oʻtmoq, ketmoq
Rasmiy hujjatlarda tayyor iboralar: в связи с (… munosabati bilan), в соответствии с (… ga muvofiq). ¦ Yuqorida bayon etilganlar munosabati bilan…
Murakkab bogʻlovchilar: несмотря на то что (… ga qaramay), в то время как (… holbuki). ¦ … ga qaramay, … holbuki
Publitsistikada kirish soʻzlari: Как известно (maʼlumki), Следует подчеркнуть (taʼkidlash joiz). ¦ Maʼlumki… Taʼkidlash lozimki…
Frazeologizmlar butun holda maʼno beradi va soʻzma-soʻz tarjima qilinmaydi. ¦ bekorchilik qilmoq, aldab yurmoq
Prefiks va suffikslar bilan yangi soʻz yasaladi: писать → переписать, писатель. ¦ yozmoq → koʻchirib yozmoq, yozilish, yozuvchi
Bir xil gap intonatsiyaga qarab savol yoki undov boʻladi. ¦ U keldimi? / U keldi!
Uslublar: neytral, kitobiy va soʻzlashuv — vaziyatga mos soʻz tanlash. ¦ neytral, kitobiy va soʻzlashuv uslubi
Arxaizm — eskirgan soʻzlar (ибо — chunki), neologizm — yangi soʻzlar (лайкнуть). ¦ chunki, aslo; xayp, layk bosmoq
Soʻzlashuvda soʻzlar qisqaradi: Что → Чё, Сейчас → Щас. ¦ Nima? Hozir. Qani boʻlmasa.
Klassik adabiyot ifodalarini tushunish: obrazlar, eskirgan shakllar, uzun jumlalar. ¦ klassik adabiyot ifodalari
Munozarada dalil (аргумент) va qarshi dalil (контраргумент) keltirish. ¦ dalillash va qarshi dalillash`,
ja:`です — "…dir", ot va sifatdan keyin; ます — feʼlning hurmat shakli. Inkor: じゃないです / ません. ¦ Talabaman. Har kuni ishlayman.
は — gap mavzusi, が — egasi (yangi maʼlumot), を — toʻldiruvchi, に — joy/vaqt/yoʻnalish. ¦ Men suv ichaman.
これ — bu (menga yaqin), それ — u (sizga yaqin), あれ — ana u (ikkalamizdan uzoq). ¦ Bu kitob.
Gap oxiriga か qoʻyilsa, savol boʻladi. Soʻroq belgisi shart emas. ¦ Yaxshimisiz?
Soatlar 時 (ji), pul 円 (en) bilan. Sonlar: 一 ichi, 二 ni, 三 san, 千 sen (ming). ¦ Soat uch. Ming yen.
て-shakl feʼllarni bogʻlaydi va iltimos qiladi (～てください). Feʼl guruhiga qarab: 食べて, 飲んで, 行って. ¦ yeb, ichib, borib
～ました — ます shaklining oʻtgan zamoni. Inkor: ～ませんでした. ¦ Kecha bordim.
い-sifatlar oʻzi bevosita otga qoʻshiladi (高い山), な-sifatlar な bilan (静かな町). ¦ baland togʻ, tinch shahar
Feʼl (ます oʻzagi) + たい — "…moqchiman". い-sifatdek tuslanadi. ¦ Yaponiyaga bormoqchiman.
て-shakl + いる — hozir davom etayotgan ish yoki holat. ¦ Hozir oʻqiyapman.
Oddiy shakl — doʻstlar orasida va ergash gaplarda: 行く (boraman), 行った (bordim), 行かない (bormayman). ¦ bormoq, bordi, bormaydi
Imkon shakli: 話す → 話せる (gapira olaman). Toʻldiruvchi odatda が bilan. ¦ Yaponcha gapira olaman.
～たら — "…sa, …ganda"; ～ば — umumiy shart. ¦ Yomgʻir yogʻsa, bormayman.
～られる — majhul nisbat; bajaruvchi に bilan. ¦ Ustoz meni maqtadi (ustoz tomonidan maqtaldim).
Oddiy shakl + と思う — "…deb oʻylayman". ¦ Ertaga havo ochiq boʻladi deb oʻylayman.
Keigo — hurmat tili: いらっしゃる (keladi/boradi — hurmat), 申す (aytaman — kamtarlik), 伺う (boraman — kamtarlik). ¦ kelmoq (hurmat), aytmoq (kamtarlik), bormoq (kamtarlik)
～させる — orttirma: birovga ish qildirish yoki ruxsat berish. ¦ Bolaga sabzavot yedirmoq.
～ことにする — oʻzi qaror qilish; ～ようにする — odatga aylantirishga harakat qilish. ¦ Har kuni yugurishga qaror qildim.
～はず — "…kerak (mantiqan kutiladi)"; ～わけ — sabab, izoh. ¦ U kelishi kerak.
～にもかかわらず — "…ga qaramay", ～ために — "…uchun / …sababli". ¦ … ga qaramay, … uchun
Toʻliq keigo: ご～いただけますでしょうか — juda muloyim iltimos. ¦ Tekshirib bera olarmikansiz?
である — yozma, rasmiy uslubdagi "…dir". Maqola va ilmiy ishlarda. ¦ Bu muhim masaladir.
～に際して — "… chogʻida", ～をめぐって — "… atrofida, … yuzasidan". ¦ Shartnoma tuzish chogʻida…

const oN=s=>String(s||"").toLowerCase().normalize("NFKC").replace(/[̀-ͯ]/g,"").replace(/[.,!?;:'"’ʼʻ`«»()\[\]\-–—、。，？！؟،・「」…~]/g," ").replace(/\s+/g," ").trim();
function oLev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function oSim(a,b){a=oN(a).replace(/ /g,"");b=oN(b).replace(/ /g,"");if(!a||!b)return 0;return 1-oLev(a,b)/Math.max(a.length,b.length)}
const oBest=(t,x)=>Math.max(oSim(t,x.w),x.r?oSim(t,x.r.split("·").pop()):0);
function oPhr(maxLv){const out=[];for(let l=1;l<=6;l++){if(maxLv&&l>maxLv)break;const ps=parse(R()["p"+l]||"");ps.forEach((x,i)=>out.push({w:x.w,r:x.r,u:UZ["p"+l][i],lv:l}))}return out}
function oWords(){const ws=[];for(let l=1;l<=6;l++)try{ws.push(...deck(l).filter(x=>x.u))}catch(e){}(P().my||[]).forEach(x=>x.u&&ws.push(x));return ws}
const isUz=t=>/[oʻgʻ]|\b(men|sen|siz|biz|qanday|nima|qayer|qancha|bu|va|bilan|uchun|kerak|bormi|yoʻq|ha|salom|rahmat)\b/i.test(t)&&/^[a-zʻʼ'’\s.,!?-]+$/i.test(t.trim())&&!["en","tr"].includes("x");
function oDict(q){q=oN(q).replace(/\b(nima degani|nima deyiladi|qanday aytiladi|qanday deyiladi|tarjima qil|tarjimasi|degani nima|nima|degan soʻz|soʻzi)\b/g," ").replace(/\s+/g," ").trim();if(!q)return[];
 const all=[...oWords(),...oPhr()];const sc=all.map(x=>[Math.max(oBest(q,x),oSim(q,x.u),oN(x.u).split(/[,;/]/).some(p=>oN(p)===q)?1:0,oN(x.w)===q?1:0),x]).filter(a=>a[0]>=.72).sort((a,b)=>b[0]-a[0]);
 const seen=new Set();return sc.filter(([_,x])=>!seen.has(x.w)&&seen.add(x.w)).slice(0,4).map(a=>a[1])}
